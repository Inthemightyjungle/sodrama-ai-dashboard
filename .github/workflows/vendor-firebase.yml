name: Vendor Firebase

# Copies the Firebase browser library (the app and sign-in parts) into
# assets/vendor/firebase/, so the site never loads code from another server.
# The database is read through its plain web address (assets/js/backend.js),
# so the much larger database part is not needed.
# Run it by hand (Actions > Vendor Firebase > Run workflow) to move to a newer release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Firebase version (empty = latest)
        required: false

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download and copy the browser builds
        run: |
          set -e
          V="${{ github.event.inputs.version }}"
          [ -n "$V" ] || V=$(npm view firebase version)
          echo "Firebase $V"
          mkdir -p /tmp/fb && cd /tmp/fb && npm pack "firebase@$V" --silent >/dev/null && tar xzf firebase-*.tgz
          ls package | grep -E '^firebase-[a-z-]+\.js$' | head -40
          cd "$GITHUB_WORKSPACE"
          rm -rf assets/vendor/firebase && mkdir -p assets/vendor/firebase
          for part in app auth; do
            cp "/tmp/fb/package/firebase-$part.js" "assets/vendor/firebase/firebase-$part.js"
          done
          cp /tmp/fb/package/LICENSE assets/vendor/firebase/LICENSE 2>/dev/null || true
          # The builds import each other from Google's servers; point them at the local copies.
          sed -i -E "s#https://www\.gstatic\.com/firebasejs/[0-9.]+/firebase-([a-z-]+)\.js#./firebase-\1.js#g" assets/vendor/firebase/*.js
          echo "$V" > assets/vendor/firebase/VERSION
          echo "--- remaining outside addresses in import lines:"
          grep -o -E "from ?['\"][^'\"]+['\"]|import\(['\"][^'\"]+['\"]\)" assets/vendor/firebase/*.js | sort -u | head -20
          ls -la assets/vendor/firebase
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vendor/firebase
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Vendor Firebase $(cat assets/vendor/firebase/VERSION)"
          git push origin "HEAD:$GITHUB_REF_NAME"
