name: Tool icons

# Whenever the approved tools list changes, copy each tool's own icon into
# the site so the page never depends on another website to show pictures.
on:
  push:
    branches: [main, tools-draft]
    paths:
      - assets/data/tools.js
      - tools/tool_icons.py
      - tools/check_tools.py
      - .github/workflows/tool-icons.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: tool-icons-${{ github.ref }}
  cancel-in-progress: false

jobs:
  icons:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow and CairoSVG
        run: python3 -m pip install --quiet --disable-pip-version-check pillow cairosvg

      - name: Check the tools list
        run: python3 tools/check_tools.py

      - name: Fetch icons
        run: python3 tools/tool_icons.py

      - name: Save them to the repository
        id: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/img/tools assets/data/tool-icons.js
          if git diff --cached --quiet; then
            echo "Nothing changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update tool icons"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made by this workflow does not always start a Pages build,
      # so ask for one when the live branch changed.
      - name: Rebuild the live site
        if: steps.save.outputs.changed == 'true' && github.ref_name == 'main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
